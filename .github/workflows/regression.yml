name: Pruebas de regresión

on:
  push:
  pull_request:

jobs:
  selenium:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Iniciar Bloodia localmente
        run: |
          python -m http.server 8000 > /tmp/bloodia-server.log 2>&1 &
          curl --retry 10 --retry-delay 1 --retry-connrefused http://localhost:8000/

      - name: Ejecutar pruebas
        run: pytest tests/ -v --headless --html=report.html --self-contained-html

      - name: Guardar reporte y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-regresion
          path: |
            report.html
            failure_*.png
          if-no-files-found: ignore
